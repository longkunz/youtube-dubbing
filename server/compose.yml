services:
  api:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      MODEL_ROOT: /models
      CACHE_ROOT: /cache
      HF_HOME: /models/hf-cache
      PYTHONUNBUFFERED: "1"
      # GPU host only: uncomment the next two lines
      # NVIDIA_VISIBLE_DEVICES: all
    # gpus: all
    volumes:
      - ./models:/models
      - ./cache:/cache
    restart: unless-stopped
